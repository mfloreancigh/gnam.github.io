<style>
:root{

  --surface:#ffffff;

  --ink:#1e241f;
  --ink-soft:#5c6459;
  --border:#d7ddd3;
  --chip-bg:#e7ebe3;

  --c-zuppe:#b5541c;
  --c-primi:#a23327;
  --c-secondi:#5c3a21;
  --c-pesce:#235e68;
  --c-contorni:#4f6b2e;
  --c-dolci:#7a3350;
  --c-pane:#a8791a;
  --c-salse:#4b3b63;
  --c-antipasti:#2e6b5e;
  --c-bevande:#33506e;
  --c-piatti_unici:#8a4b28;
  --c-default:#4a4a44;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14170f;
    --surface:#1c2018;
    --surface-2:#232920;
    --ink:#eceee7;
    --ink-soft:#a9b0a2;
    --border:#333b2d;
    --chip-bg:#2a3124;

    --c-zuppe:#d97f3e;
    --c-primi:#c85a4c;
    --c-secondi:#a07752;
    --c-pesce:#4f9aa6;
    --c-contorni:#7f9c56;
    --c-dolci:#b06484;
    --c-pane:#cba043;
    --c-salse:#8574a8;
    --c-antipasti:#5b9c8b;
    --c-bevande:#6a90b8;
    --c-piatti_unici:#c9855a;
    --c-default:#9a9a90;
  }
}
:root[data-theme="dark"]{
  --bg:#14170f;
  --surface:#1c2018;
  --surface-2:#232920;
  --ink:#eceee7;
  --ink-soft:#a9b0a2;
  --border:#333b2d;
  --chip-bg:#2a3124;

  --c-zuppe:#d97f3e;
  --c-primi:#c85a4c;
  --c-secondi:#a07752;
  --c-pesce:#4f9aa6;
  --c-contorni:#7f9c56;
  --c-dolci:#b06484;
  --c-pane:#cba043;
  --c-salse:#8574a8;
  --c-antipasti:#5b9c8b;
  --c-bevande:#6a90b8;
  --c-piatti_unici:#c9855a;
  --c-default:#9a9a90;
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Work Sans",system-ui,sans-serif;
}
body.modal-open{overflow:hidden;}

.topbar{
  position:sticky; top:0; z-index:10;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:16px 24px 12px;
}
.topbar-row{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px 16px;}
.topbar h1{
  font-family:"Oswald",sans-serif;
  font-weight:700;
  font-size:22px;
  letter-spacing:0.04em;
  text-transform:uppercase;
  margin:0;
}
.topbar .count{
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;
  color:var(--ink-soft);
}
.controls{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px;}
.controls input[type="search"]{
  font-family:"Work Sans",sans-serif;
  font-size:13px;
  padding:7px 12px;
  border:1px solid var(--border);
  border-radius:5px;
  background:var(--surface);
  color:var(--ink);
  min-width:200px;
}
.chip{
  font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;
  letter-spacing:0.03em;
  text-transform:uppercase;
  padding:5px 10px;
  border-radius:4px;
  background:var(--chip-bg);
  color:var(--ink-soft);
  border:1px solid transparent;
  cursor:pointer;
  user-select:none;
  white-space:nowrap;
}
.chip:hover{border-color:var(--border);}
.chip[aria-pressed="true"]{
  background:var(--ink);
  color:var(--bg);
}
.chip-row{display:flex; flex-wrap:wrap; gap:6px;}

.empty{
  padding:40px 24px;
  text-align:center;
  color:var(--ink-soft);
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
  gap:18px;
  padding:20px 24px 60px;
  max-width:1500px;
  margin:0 auto;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:6px;
  overflow:hidden;
  break-inside:avoid;
  display:flex;
  flex-direction:column;
}
.card-head{
  padding:12px 14px 10px;
  color:#fff;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}
.card-head:hover, .card-head:focus-visible{filter:brightness(1.1);}
.card-head:focus-visible{outline:2px solid #fff; outline-offset:-3px;}
.card-head .head-text{flex:1; min-width:0;}
.card-head .chevron{
  font-family:"IBM Plex Mono",monospace;
  font-size:22px;
  line-height:1;
  opacity:0.75;
  flex-shrink:0;
}
.card-head .name{
  font-family:"Oswald",sans-serif;
  font-weight:600;
  font-size:17px;
  line-height:1.15;
  text-transform:uppercase;
  letter-spacing:0.01em;
  text-wrap:balance;
}
.card-head .meta{
  font-family:"IBM Plex Mono",monospace;
  font-size:10px;
  letter-spacing:0.03em;
  text-transform:uppercase;
  opacity:0.92;
  margin-top:4px;
  display:flex; gap:8px; flex-wrap:wrap;
}

.modal-overlay{
  position:fixed; inset:0;
  background:rgba(10,12,8,0.6);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
  z-index:100;
}
.modal-overlay[hidden]{display:none;}
.modal{
  background:var(--surface);
  border-radius:8px;
  max-width:640px;
  width:100%;
  max-height:85vh;
  overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,0.35);
}
.modal-head{
  padding:18px 50px 16px 18px;
  color:#fff;
  position:sticky; top:0;
  z-index:1;
}
.modal-head .name{
  font-family:"Oswald",sans-serif;
  font-weight:700;
  font-size:22px;
  line-height:1.2;
  text-transform:uppercase;
  text-wrap:balance;
}
.modal-head .meta{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  letter-spacing:0.03em;
  text-transform:uppercase;
  opacity:0.92;
  margin-top:6px;
  display:flex; gap:8px; flex-wrap:wrap;
}
.modal-close{
  position:absolute; top:14px; right:14px;
  width:32px; height:32px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,0.2);
  color:#fff;
  font-size:18px;
  line-height:1;
  cursor:pointer;
}
.modal-close:hover{background:rgba(255,255,255,0.32);}
.modal-body{padding:18px;}
.modal-section{margin-bottom:20px;}
.modal-section:last-child{margin-bottom:0;}
.modal-section h3{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin:0 0 10px;
  border-bottom:1px solid var(--border);
  padding-bottom:6px;
}
.modal-section ul, .modal-section ol{
  margin:0; padding-left:22px;
  font-size:14px; line-height:1.6;
}
.modal-section ul{list-style:disc;}
.modal-section li{margin-bottom:6px;}
.modal-section li:last-child{margin-bottom:0;}
.modal-section .step-num{
  font-family:"IBM Plex Mono",monospace;
  color:var(--ink-soft);
  margin-right:6px;
}
.modal-card-ref{
  font-size:12px;
  color:var(--ink-soft);
  margin-top:2px;
}

@media (max-width: 640px){
  .modal-overlay{padding:0;}
  .modal{max-width:100%; max-height:100%; height:100%; border-radius:0;}
}
.card-body{
  display:grid;
  grid-template-columns:1fr 1fr;
  flex:1;
}
.field{
  padding:10px 12px;
  border-top:1px solid var(--border);
  border-left:1px solid var(--border);
}
.field:nth-child(1),.field:nth-child(2){border-top:none;}
.field:nth-child(odd){border-left:none;}
.field .label{
  font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;
  letter-spacing:0.06em;
  color:var(--ink-soft);
  text-transform:uppercase;
  margin-bottom:4px;
}
.field .value{
  font-size:12.5px;
  line-height:1.42;
}
.field .value .none{color:var(--ink-soft); font-style:italic;}

@media (max-width: 640px){
  .topbar{padding:14px 16px 10px;}
  .grid{grid-template-columns:1fr; gap:14px; padding:14px 16px 40px;}
  .card-head .name{font-size:19px;}
  .card-body{grid-template-columns:1fr;}
  .field{border-left:none; padding:12px 14px;}
  .field:nth-child(2){border-top:1px solid var(--border);}
  .field .value{font-size:13.5px;}
  .controls input[type="search"]{width:100%; font-size:16px; padding:11px 14px;}
}

@media print{
  .topbar, .empty{display:none;}
  .grid{grid-template-columns:1fr 1fr; gap:10px; padding:0;}
  body{background:#fff;}
  .card{border:1px solid #999; break-inside:avoid;}
}
</style>

<div class="topbar">
  <div class="topbar-row">
    <h1>GNAM</h1>
    <span class="count" id="count"></span>
  </div>
  <div class="controls">
    <input type="search" id="search" placeholder="Cerca per nome…">
  </div>
  <div class="controls chip-row" id="chips"></div>
</div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden>Nessuna ricetta trovata.</div>

<div class="modal-overlay" id="modalOverlay" hidden>

    <div class="modal-body">

      </div>
      <div class="modal-section">
        <h3>Procedimento</h3>
        <ol id="modalSteps"></ol>
      </div>
    </div>
  </div>
</div>

const CAT_ORDER = ["zuppe","primi","secondi","pesce","antipasti","piatti_unici","secondi","contorni","salse","pane","dolci","bevande"];
const catLabels = {};
RECIPES.forEach(r => { if(!catLabels[r.cat]) catLabels[r.cat] = r.catLabel.split(' / ')[0]; });
const cats = Object.keys(catLabels).sort((a,b) => {
  const ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b);
  return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
});

const grid = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const countEl = document.getElementById('count');
const searchInput = document.getElementById('search');
const chipsEl = document.getElementById('chips');

let state = { q: '', cat: 'all' };
try {
  const saved = JSON.parse(localStorage.getItem('comande-filter') || '{}');
  if (saved.cat) state.cat = saved.cat;
  if (saved.q) state.q = saved.q;
} catch(e) {}

function saveState(){
  try { localStorage.setItem('comande-filter', JSON.stringify(state)); } catch(e) {}
}

function buildChips(){
  chipsEl.innerHTML = '';
  const allChip = document.createElement('span');
  allChip.className = 'chip';
  allChip.dataset.cat = 'all';
  allChip.textContent = 'Tutte (' + RECIPES.length + ')';
  chipsEl.appendChild(allChip);
  cats.forEach(cat => {
    const n = RECIPES.filter(r => r.cat === cat).length;
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.dataset.cat = cat;
    chip.textContent = catLabels[cat] + ' (' + n + ')';
    chipsEl.appendChild(chip);
  });
  chipsEl.querySelectorAll('.chip').forEach(chip => {
    chip.setAttribute('aria-pressed', chip.dataset.cat === state.cat ? 'true' : 'false');
    chip.addEventListener('click', () => {
      state.cat = chip.dataset.cat;
      saveState();
      buildChips();
      render();
    });
  });
}

function render(){
  const q = state.q.trim().toLowerCase();
  const filtered = RECIPES.filter(r => {
    if (state.cat !== 'all' && r.cat !== state.cat) return false;
    if (q && !r.name.toLowerCase().includes(q)) return false;
    return true;
  });
  countEl.textContent = filtered.length + ' / ' + RECIPES.length + ' ricette';
  grid.innerHTML = '';
  emptyEl.hidden = filtered.length > 0;
  filtered.forEach(r => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head" style="background:var(--c-${r.cat}, var(--c-default))" role="button" tabindex="0" aria-label="Apri ricetta completa">
        <div class="head-text">
          <div class="name"></div>
          <div class="meta"><span class="catlabel"></span><span>·</span><span class="porz"></span><span>·</span><span class="tempo"></span></div>
        </div>
        <div class="chevron">›</div>
      </div>
      <div class="card-body">
        ${r.fields.map(() => `
          <div class="field">
            <div class="label"></div>
            <div class="value"></div>
          </div>`).join('')}
      </div>
    `;
    card.querySelector('.name').textContent = r.name;
    card.querySelector('.catlabel').textContent = r.catLabel;
    card.querySelector('.porz').textContent = (r.porzioni === '—' ? '—' : r.porzioni + ' porz.');
    card.querySelector('.tempo').textContent = r.tempo;
    const fieldEls = card.querySelectorAll('.field');
    r.fields.forEach((f, i) => {
      fieldEls[i].querySelector('.label').textContent = f.label;
      const valueEl = fieldEls[i].querySelector('.value');
      if (f.value === '—') {
        const span = document.createElement('span');
        span.className = 'none';
        span.textContent = '—';
        valueEl.appendChild(span);
      } else {
        valueEl.textContent = f.value;
      }
    });
    const head = card.querySelector('.card-head');
    head.addEventListener('click', () => openModal(r));
    head.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(r); }
    });
    grid.appendChild(card);
  });
}

searchInput.value = state.q;
searchInput.addEventListener('input', e => {
  state.q = e.target.value;
  saveState();
  render();
});

// --- Modale ricetta completa ---
const modalOverlay = document.getElementById('modalOverlay');
const modalHead = document.getElementById('modalHead');
const modalName = document.getElementById('modalName');
const modalMeta = document.getElementById('modalMeta');
const modalIngredients = document.getElementById('modalIngredients');
const modalSteps = document.getElementById('modalSteps');
const modalClose = document.getElementById('modalClose');
let lastFocused = null;

function openModal(r){
  const full = (typeof FULL_RECIPES !== 'undefined') ? FULL_RECIPES[r.name] : null;

  modalHead.style.background = `var(--c-${r.cat}, var(--c-default))`;
  modalName.textContent = r.name;
  modalMeta.innerHTML = '';
  [r.catLabel, (r.porzioni === '—' ? '—' : r.porzioni + ' porz.'), r.tempo].forEach((t, i) => {
    if (i > 0) modalMeta.appendChild(document.createTextNode('· '));
    const span = document.createElement('span');
    span.textContent = t;
    modalMeta.appendChild(span);
  });

  modalIngredients.innerHTML = '';
  modalSteps.innerHTML = '';

  if (full && full.ingredients && full.ingredients.length) {
    full.ingredients.forEach(ing => {
      const li = document.createElement('li');
      li.textContent = ing;
      modalIngredients.appendChild(li);
    });
  } else {
    const li = document.createElement('li');
    li.textContent = 'Ingredienti non disponibili.';
    modalIngredients.appendChild(li);
  }

  if (full && full.steps && full.steps.length) {
    full.steps.forEach(step => {
      const li = document.createElement('li');
      li.textContent = step;
      modalSteps.appendChild(li);
    });
  } else {
    const li = document.createElement('li');
    li.textContent = 'Procedimento non disponibile.';
    modalSteps.appendChild(li);
  }

  lastFocused = document.activeElement;
  modalOverlay.hidden = false;
  document.body.classList.add('modal-open');
  modalClose.focus();
}

function closeModal(){
  modalOverlay.hidden = true;
  document.body.classList.remove('modal-open');
  if (lastFocused && lastFocused.focus) lastFocused.focus();
}

modalClose.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', e => {
  if (e.target === modalOverlay) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !modalOverlay.hidden) closeModal();
});

buildChips();
render();
</script>
