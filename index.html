    --c-contorni:#7f9c56;
    --c-dolci:#b06484;
    --c-pane:#cba043;
    --c-salse:#8574a8;
    --c-antipasti:#5b9c8b;
    --c-bevande:#6a90b8;
    --c-piatti_unici:#c9855a;
    --c-default:#9a9a90;
  }
}
:root[data-theme="dark"]{
  --bg:#14170f;
  --surface:#1c2018;
  --surface-2:#232920;
  --ink:#eceee7;
  --ink-soft:#a9b0a2;
  --border:#333b2d;
  --chip-bg:#2a3124;

  --c-primi:#c85a4c;

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Work Sans",system-ui,sans-serif;
}

.topbar{
  position:sticky; top:0; z-index:10;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:16px 24px 12px;
}
.topbar-row{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px 16px;}
.topbar h1{
  font-family:"Oswald",sans-serif;
  font-weight:700;
  font-size:22px;
  letter-spacing:0.04em;
  text-transform:uppercase;
  margin:0;
}
.topbar .count{
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;
  color:var(--ink-soft);
}
.controls{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px;}
.controls input[type="search"]{
  font-family:"Work Sans",sans-serif;
  font-size:13px;
  padding:7px 12px;
  border:1px solid var(--border);
  border-radius:5px;
  background:var(--surface);
  color:var(--ink);
  min-width:200px;
}
.chip{
  font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;
  letter-spacing:0.03em;
  text-transform:uppercase;
  padding:5px 10px;
  border-radius:4px;
  background:var(--chip-bg);
  color:var(--ink-soft);
  border:1px solid transparent;
  cursor:pointer;
  user-select:none;
  white-space:nowrap;
}
.chip:hover{border-color:var(--border);}
.chip[aria-pressed="true"]{
  background:var(--ink);
  color:var(--bg);
}
.chip-row{display:flex; flex-wrap:wrap; gap:6px;}

.empty{
  padding:40px 24px;
  text-align:center;
  color:var(--ink-soft);
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
  gap:18px;
  padding:20px 24px 60px;
  max-width:1500px;
  margin:0 auto;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:6px;
  overflow:hidden;
  break-inside:avoid;
  display:flex;
  flex-direction:column;
}
.card-head{
  padding:12px 14px 10px;
  color:#fff;
}
.card-head .name{
  font-family:"Oswald",sans-serif;
  font-weight:600;
  font-size:17px;
  line-height:1.15;
  text-transform:uppercase;
  letter-spacing:0.01em;
  text-wrap:balance;
}
.card-head .meta{
  font-family:"IBM Plex Mono",monospace;
  font-size:10px;
  letter-spacing:0.03em;
  text-transform:uppercase;
  opacity:0.92;
  margin-top:4px;
  display:flex; gap:8px; flex-wrap:wrap;
}
.card-body{
  display:grid;
  grid-template-columns:1fr 1fr;
  flex:1;
}
.field{
  padding:10px 12px;
  border-top:1px solid var(--border);
  border-left:1px solid var(--border);
}
.field:nth-child(1),.field:nth-child(2){border-top:none;}
.field:nth-child(odd){border-left:none;}
.field .label{
  font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;
  letter-spacing:0.06em;
  color:var(--ink-soft);
  text-transform:uppercase;
  margin-bottom:4px;
}
.field .value{
  font-size:12.5px;
  line-height:1.42;
}
.field .value .none{color:var(--ink-soft); font-style:italic;}

@media (max-width: 640px){
  .topbar{padding:14px 16px 10px;}
  .grid{grid-template-columns:1fr; gap:14px; padding:14px 16px 40px;}
  .card-head .name{font-size:19px;}
  .card-body{grid-template-columns:1fr;}
  .field{border-left:none; padding:12px 14px;}
  .field:nth-child(2){border-top:1px solid var(--border);}
  .field .value{font-size:13.5px;}
    .controls input[type="search"]{width:100%; font-size:16px; padding:11px 14px;}
}
  
@media print{
  .topbar, .empty{display:none;}
  .grid{grid-template-columns:1fr 1fr; gap:10px; padding:0;}
  body{background:#fff;}
  .card{border:1px solid #999; break-inside:avoid;}
}
</style>

const CAT_ORDER = ["zuppe","primi","secondi","pesce","antipasti","piatti_unici","secondi","contorni","salse","pane","dolci","bevande"];
const catLabels = {};
RECIPES.forEach(r => { if(!catLabels[r.cat]) catLabels[r.cat] = r.catLabel.split(' / ')[0]; });
const cats = Object.keys(catLabels).sort((a,b) => {
  const ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b);
  return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
});

const grid = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const countEl = document.getElementById('count');
const searchInput = document.getElementById('search');
const chipsEl = document.getElementById('chips');

let state = { q: '', cat: 'all' };
try {
  const saved = JSON.parse(localStorage.getItem('comande-filter') || '{}');
  if (saved.cat) state.cat = saved.cat;
  if (saved.q) state.q = saved.q;
} catch(e) {}

function saveState(){
  try { localStorage.setItem('comande-filter', JSON.stringify(state)); } catch(e) {}
}

function buildChips(){
  chipsEl.innerHTML = '';
  const allChip = document.createElement('span');
  allChip.className = 'chip';
  allChip.dataset.cat = 'all';
  allChip.textContent = 'Tutte (' + RECIPES.length + ')';
  chipsEl.appendChild(allChip);
  cats.forEach(cat => {
    const n = RECIPES.filter(r => r.cat === cat).length;
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.dataset.cat = cat;
    chip.textContent = catLabels[cat] + ' (' + n + ')';
    chipsEl.appendChild(chip);
  });
  chipsEl.querySelectorAll('.chip').forEach(chip => {
    chip.setAttribute('aria-pressed', chip.dataset.cat === state.cat ? 'true' : 'false');
    chip.addEventListener('click', () => {
      state.cat = chip.dataset.cat;
      saveState();
      buildChips();
      render();
    });
  });
}

function render(){
  const q = state.q.trim().toLowerCase();
  const filtered = RECIPES.filter(r => {
    if (state.cat !== 'all' && r.cat !== state.cat) return false;
    if (q && !r.name.toLowerCase().includes(q)) return false;
    return true;
  });
  countEl.textContent = filtered.length + ' / ' + RECIPES.length + ' ricette';
  grid.innerHTML = '';
  emptyEl.hidden = filtered.length > 0;
  filtered.forEach(r => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head" style="background:var(--c-${r.cat}, var(--c-default))">
        <div class="name"></div>
        <div class="meta"><span class="catlabel"></span><span>·</span><span class="porz"></span><span>·</span><span class="tempo"></span></div>
      </div>
      <div class="card-body">
        ${r.fields.map(() => `
          <div class="field">
            <div class="label"></div>
            <div class="value"></div>
          </div>`).join('')}
      </div>
    `;
    card.querySelector('.name').textContent = r.name;
    card.querySelector('.catlabel').textContent = r.catLabel;
    card.querySelector('.porz').textContent = (r.porzioni === '—' ? '—' : r.porzioni + ' porz.');
    card.querySelector('.tempo').textContent = r.tempo;
    const fieldEls = card.querySelectorAll('.field');
    r.fields.forEach((f, i) => {
      fieldEls[i].querySelector('.label').textContent = f.label;
      const valueEl = fieldEls[i].querySelector('.value');
      if (f.value === '—') {
        const span = document.createElement('span');
        span.className = 'none';
        span.textContent = '—';
        valueEl.appendChild(span);
      } else {
        valueEl.textContent = f.value;
      }
    });
    grid.appendChild(card);
  });
}

searchInput.value = state.q;
searchInput.addEventListener('input', e => {
  state.q = e.target.value;
  saveState();
  render();
});

buildChips();
render();
</script>
